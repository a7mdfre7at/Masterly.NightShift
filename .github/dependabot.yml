# Weekly update pull requests for the NuGet packages (Directory.Packages.props, central package management) and the
# GitHub Actions the workflows use. After merging a NuGet update, the lock files must agree: CI restores in locked
# mode, so run `dotnet restore Masterly.NightShift.slnx --force-evaluate` and commit the packages.lock.json changes
# if Dependabot's pull request doesn't include them.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Kept at the oldest Roslyn the source generators need, see Directory.Packages.props
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      # Masterly.NightShift.NetCore asks for the oldest serviced Microsoft.Extensions version of each target framework
      # (8.0.x on net8.0, 10.0.x on net10.0), so apps keep their runtime's stack: patches only, never a new major
      - dependency-name: Microsoft.Extensions.DependencyInjection.Abstractions
        update-types: [ "version-update:semver-major" ]
      - dependency-name: Microsoft.Extensions.Hosting.Abstractions
        update-types: [ "version-update:semver-major" ]
      - dependency-name: Microsoft.Extensions.Logging.Abstractions
        update-types: [ "version-update:semver-major" ]
      # The dashboard page generator must reproduce RazorGenerator's output byte for byte; move it on purpose only
      - dependency-name: Microsoft.AspNetCore.Razor.Language
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "System.*"
      tests:
        patterns:
          - "xunit*"
          - "Moq*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The documentation site. The Docusaurus packages move together, so they come as one pull request; docs.yml builds
  # the site on it, which fails on any broken link.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@easyops-cn/*"
      react:
        patterns:
          - "react"
          - "react-dom"
