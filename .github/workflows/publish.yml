name: Publish to NuGet

# Runs after a successful Build of a push to master, and publishes the packages that Build tested. A manual run on
# master has no Build to take them from, so it restores, builds, tests and packs the commit itself. The version is
# <Version> in src/Directory.Build.props, and CHANGELOG.md must have a '## [x.y.z]' section for it. Packages whose
# version is already on nuget.org are skipped, and the GitHub Release is created once per version, so a later commit
# at the same version publishes nothing new: raising <Version> is the release act.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build]
    branches: [master]
    types: [completed]

# Two publish runs never overlap, so package pushes and the GitHub Release can't race. A run that has started is never
# cancelled: a half-finished push is repaired only by a later complete run (or a re-run of this one). GitHub replaces a
# run that is still queued when a newer one arrives, which is safe because the newer run publishes the newer commit.
concurrency:
  group: publish-nuget
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  # The nuget.org profile that owns the packages and the Trusted Publishing policy (a profile name, never an email)
  NUGET_USER: a7mdfre7at
  PACKAGE_OUTPUT: artifacts

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    # A manual run builds and runs every test project on both target frameworks
    timeout-minutes: 60
    # Only a successful Build of a push to master publishes: a pull_request Build (including one from a fork's own
    # 'master' branch) never gets to exchange an OIDC token for a NuGet API key. A manual run publishes only from
    # master, and runs the tests itself.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master') }}
    # Optional protection rules (required reviewers, deployment branches) are set on this environment in the
    # repository's Settings > Environments
    environment: nuget
    permissions:
      # Creating the GitHub Release
      contents: write
      # Downloading the packages from the triggering Build run
      actions: read
      # Trusted Publishing: the job presents a GitHub OIDC token to nuget.org, which exchanges it for a one-hour API key
      # under the nuget.org policy (owner a7mdfre7at, repository Masterly.NightShift, workflow publish.yml). No
      # long-lived NuGet API key is stored in the repository.
      id-token: write
    env:
      # The commit the triggering Build tested; a manual run publishes the commit it was started on
      PUBLISH_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PUBLISH_SHA }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x # runtime for the net8.0 tests of a manual run

      # Every package ships with the same version, from src/Directory.Build.props
      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/Directory.Build.props | head -n 1 | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "::error::No <Version> element found in src/Directory.Build.props."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      # Checked before anything is built or pushed, on every kind of run. The release body is only this version's
      # section, without its heading (the release title already names the version).
      - name: Read the release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if ! tr -d '\r' < CHANGELOG.md | grep -q -F "## [$VERSION]"; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi
          tr -d '\r' < CHANGELOG.md \
            | awk -v version="$VERSION" '/^## \[/{ if (f) exit; if (index($0, "## [" version "]") == 1) { f=1; next } } f' \
            | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::The '## [$VERSION]' section of CHANGELOG.md is empty."
            exit 1
          fi

      # A manual run has no Build to take the packages from: the steps up to the pack make them here, as the Build's
      # Windows and Linux jobs would. A workflow_run skips them and downloads the Build's packages instead.
      - name: Cache NuGet packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # The servers of the Build's Linux job, as containers started by hand: service containers would start on every
      # run, and MongoDB needs --replSet for transactions (a one-member replica set). The SA password is a throwaway
      # for a container that only lives for this job.
      - name: Start SQL Server, Redis and MongoDB
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          docker run -d --name sqlserver -e ACCEPT_EULA=Y -e 'MSSQL_SA_PASSWORD=Password12!' -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          docker run -d --name redis -p 127.0.0.1:6379:6379 redis:7.4.12
          docker run -d --name mongo -p 127.0.0.1:27017:27017 mongo:7.0.45 --replSet rs0 --bind_ip_all
          wait_for() {
            local name="$1"
            shift
            for attempt in $(seq 1 60); do
              if "$@" > /dev/null 2>&1; then return 0; fi
              sleep 2
            done
            echo "::error::$name didn't start."
            exit 1
          }
          wait_for 'SQL Server' docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password12!' -C -Q 'SELECT 1' -b
          wait_for Redis docker exec redis redis-cli ping
          wait_for 'The MongoDB replica set' docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}).ok"
          wait_for 'The MongoDB primary' docker exec mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) { quit(1) }'

      - name: Restore dependencies
        if: github.event_name == 'workflow_dispatch'
        run: dotnet restore Masterly.NightShift.slnx

      - name: Build
        if: github.event_name == 'workflow_dispatch'
        run: dotnet build Masterly.NightShift.slnx -c Release --no-restore

      - name: Test (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          NightShift_SqlServer_ConnectionStringTemplate: Server=tcp:127.0.0.1,1433;Database={0};User Id=sa;Password=Password12!;TrustServerCertificate=True;PoolBlockingPeriod=NeverBlock
          NightShift_Redis_Configuration: 127.0.0.1:6379
          NightShift_Mongo_ConnectionString: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
        run: |
          set -euo pipefail
          for framework in net8.0 net10.0; do
            for project in Core SqlServer AspNetCore InMemory EntityFrameworkCore Redis MongoDB; do
              dotnet test "tests/Masterly.NightShift.$project.Tests" -c Release --no-build -f "$framework"
            done
          done

      - name: Pack (manual run only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          for project in Core SqlServer NetCore AspNetCore InMemory Redis MongoDB EntityFrameworkCore; do
            dotnet pack "src/Masterly.NightShift.$project" -c Release --no-build -o "$PACKAGE_OUTPUT"
          done
          dotnet pack src/Masterly.NightShift -c Release --no-build -o "$PACKAGE_OUTPUT"

      # The packages the Build workflow packed and its consumer job installed, not a rebuild
      - name: Download the tested packages
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: ${{ env.PACKAGE_OUTPUT }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Requested right before the push: the temporary key lives one hour and each OIDC token buys exactly one key
      - name: Get a temporary NuGet API key (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      # In dependency order: a package never reaches nuget.org before one it depends on, and the meta-package, which
      # depends on all the others, goes last. --skip-duplicate makes a re-run after a partial failure push only what is
      # missing.
      - name: Push packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for id in Masterly.NightShift.Core Masterly.NightShift.SqlServer Masterly.NightShift.InMemory Masterly.NightShift.Redis Masterly.NightShift.MongoDB Masterly.NightShift.EntityFrameworkCore Masterly.NightShift.NetCore Masterly.NightShift.AspNetCore Masterly.NightShift; do
            package="$PACKAGE_OUTPUT/$id.$VERSION.nupkg"
            if [ ! -f "$package" ]; then
              echo "::error::$package is missing from the packages."
              exit 1
            fi
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE" --skip-duplicate
          done

      # Idempotent: creates the release when it doesn't exist, otherwise uploads only the assets it is missing (an
      # earlier run that failed mid-upload). Existing assets are never replaced, so a later commit at the same version
      # can't swap the released packages for different builds.
      - name: Create or complete the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          ASSETS=("$PACKAGE_OUTPUT"/*.nupkg)
          if gh release view "$TAG" > /dev/null 2>&1; then
            EXISTING="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            MISSING=()
            for asset in "${ASSETS[@]}"; do
              if ! grep -Fxq -- "$(basename "$asset")" <<< "$EXISTING"; then
                MISSING+=("$asset")
              fi
            done
            if [ "${#MISSING[@]}" -eq 0 ]; then
              echo "Release $TAG already has every asset; nothing to do."
            else
              echo "Release $TAG exists; uploading ${#MISSING[@]} missing asset(s)."
              gh release upload "$TAG" "${MISSING[@]}"
            fi
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Masterly.NightShift $TAG" \
              --notes-file release-notes.md \
              --target "$PUBLISH_SHA"
          fi

  on-failure:
    name: Build Failed
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: Report failure
        run: |
          echo "::error::The Build workflow failed, so nothing was published."
          exit 1
